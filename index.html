<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마케팅 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ════════════════════════════════════════════════════════════════════
       SCREEN 1: 비밀번호
  ════════════════════════════════════════════════════════════════════ -->
  <div id="screen-password" class="screen active">
    <div class="pw-card">
      <div class="pw-lock">🔒</div>
      <h1>HBS13기 M2 마케팅 퀴즈</h1>
      <p class="pw-subtitle">HBS 13기 Module 2 마케팅 온라인강의 핵심 내용을<br>스스로 점검하기 위해 만들어졌습니다.</p>
      <p>접근하려면 비밀번호를 입력하세요</p>
      <div class="pw-input-wrap">
        <input id="pw-input" type="password" placeholder="비밀번호 입력" autocomplete="off">
        <button id="btn-pw" class="btn-primary">확인</button>
      </div>
      <p id="pw-error"></p>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════
       SCREEN 2: 시작
  ════════════════════════════════════════════════════════════════════ -->
  <div id="screen-start" class="screen">
    <div class="start-card">
      <div class="start-icon">📋</div>
      <h1>마케팅 퀴즈</h1>
      <p class="start-desc">총 35문항 · OX형 15문항 + 객관식 20문항</p>
      <div class="start-meta">
        <span>100점 만점</span>
        <span class="sep">·</span>
        <span>문항 무작위 출제</span>
        <span class="sep">·</span>
        <span>B2B 마케팅</span>
      </div>
      <button id="btn-start" class="btn-primary">시험 시작하기</button>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════
       SCREEN 3: 문제
  ════════════════════════════════════════════════════════════════════ -->
  <div id="screen-quiz" class="screen">

    <!-- 상단 헤더 / 진행바 -->
    <header class="quiz-header">
      <div class="header-inner">
        <span class="question-counter">
          <strong id="q-current">1</strong> / <span id="q-total">35</span>
        </span>
        <div class="progress-bar-wrap">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <span id="q-type-badge" class="type-badge">OX형</span>
      </div>
    </header>

    <!-- 문제 영역 -->
    <main class="quiz-main">
      <div class="question-card">
        <p id="q-number-label" class="q-number-label">문제 1</p>
        <p id="q-text" class="q-text"></p>

        <!-- OX 보기 -->
        <div id="answer-ox" class="answer-area ox-area">
          <button class="ox-btn" data-value="O">
            <span class="ox-circle">O</span>
            <span>맞다 (O)</span>
          </button>
          <button class="ox-btn" data-value="X">
            <span class="ox-circle">X</span>
            <span>틀리다 (X)</span>
          </button>
        </div>

        <!-- 객관식 보기 -->
        <div id="answer-mc" class="answer-area mc-area" style="display:none">
          <button class="mc-btn" data-index="0">
            <span class="mc-num">①</span>
            <span class="mc-text"></span>
          </button>
          <button class="mc-btn" data-index="1">
            <span class="mc-num">②</span>
            <span class="mc-text"></span>
          </button>
          <button class="mc-btn" data-index="2">
            <span class="mc-num">③</span>
            <span class="mc-text"></span>
          </button>
          <button class="mc-btn" data-index="3">
            <span class="mc-num">④</span>
            <span class="mc-text"></span>
          </button>
        </div>
      </div>

      <!-- 제출 버튼 -->
      <button id="btn-submit" class="btn-primary btn-submit" disabled>제출하기</button>
    </main>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════
       SCREEN 4: 결과
  ════════════════════════════════════════════════════════════════════ -->
  <div id="screen-result" class="screen">
    <div class="result-card">
      <div id="result-emoji" class="result-emoji">🏆</div>
      <h2 id="result-score" class="result-score">--점</h2>
      <p id="result-grade" class="result-grade"></p>
      <div class="result-stats">
        <div class="stat-item">
          <span class="stat-num" id="stat-correct">0</span>
          <span class="stat-label">정답</span>
        </div>
        <span class="stat-sep">|</span>
        <div class="stat-item">
          <span class="stat-num" id="stat-wrong">0</span>
          <span class="stat-label">오답</span>
        </div>
        <span class="stat-sep">|</span>
        <div class="stat-item">
          <span class="stat-num">35</span>
          <span class="stat-label">전체</span>
        </div>
      </div>
      <p class="result-encourage">🎉 좋은 결과 있으시길 바라겠습니다. 파이팅!</p>
      <button id="btn-retry" class="btn-primary">다시 풀기</button>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════
       MODAL: 정답/오답 피드백
  ════════════════════════════════════════════════════════════════════ -->
  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true">
    <div id="modal-box" class="modal-box">
      <div id="modal-emoji" class="modal-emoji"></div>
      <h3 id="modal-verdict" class="modal-verdict"></h3>

      <!-- 오답일 때만 표시 -->
      <div id="modal-explanation" class="modal-explanation" style="display:none">
        <p class="explanation-label">
          정답: <strong id="modal-correct-answer"></strong>
        </p>
        <p id="modal-exp-text" class="exp-text"></p>
      </div>

      <button id="btn-next" class="btn-primary">다음 문제 →</button>
    </div>
  </div>

  <script src="quiz.js"></script>
</body>
</html>
